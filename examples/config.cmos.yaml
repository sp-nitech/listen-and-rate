# Listen and Rate - Example CMOS (Comparative MOS / CCR) Configuration

test_type: cmos

title: "Audio Quality Comparison"

# Prose shown above every trial. The line breaks here are this file's own
# wrapping and reflow when displayed. Leave a blank line where the text
# should break.
instructions: |
  You will hear two versions of the same sentence, played as "A" and "B".
  Listen to both completely, then rate how B compares to A on a scale from
  -3 (much worse) to +3 (much better). 0 means about the same.
  You may replay each sample as many times as needed before rating.
  Which system plays as A or B is randomized for every trial.

output:
  format: csv # "csv" or "json" - each session is saved as a separate file
  path: ./results/

# Identifies this experiment. Used as the results subdirectory under
# output.path. Defaults to the config file's name. Set this only if the
# filename is not a valid directory name. Otherwise an error is raised
# instead of silently modifying the name.
# experiment_id: null

# How much of each page's audio to fetch up front (default: auto).
#   none - fetch nothing until the listener first presses play
#   auto - fetch the whole clip on show so playback is instant (a hint,
#          browsers may fetch less on metered/mobile connections)
# The clip length is shown on the time bar regardless of this setting.
# audio_preload: auto

# Presentation order of the per-session stimuli/trials (default: random).
# "random" shuffles the order per listener to cancel order effects, and
# "fixed" keeps the configured order. This governs ordering ONLY - which
# subset each listener is sampled, and the within-trial position blinding,
# are always randomized.
# presentation_order: random

# CMOS tests compare exactly 2 systems, defined via directories (each dir
# should contain the same filenames - explicit `stimuli:` lists are not
# supported for CMOS tests). Unlike DMOS, no system needs to be flagged
# `reference: true` - both systems are compared symmetrically, and which one
# plays as "A" vs "B" is blinded per trial.
stimuli_dirs:
  items_per_session: 2 # optional: present N randomly chosen trials per listener
  systems:
    - path: ./stimuli/examples/A
      system: Clean
    - path: ./stimuli/examples/B
      system: Noisy

# -- Practice stage (optional) ------------------------------------------------
# When count > 0, a practice round is shown after the metadata form and before
# the real test: count trials are drawn from the full pool independently of
# the session's trials (overlap allowed), and practice responses are discarded.
# practice:
#   count: 1 # number of practice trials (default: 0 = no practice)
#   instructions: | # shown in a banner above the regular instructions
#     This is a practice session. Your ratings will not be recorded.

# -- Loudness check (optional) ------------------------------------------------
# When configured, each stimulus's integrated loudness (LUFS) are measured. If
# a threshold is exceeded, the offending values are shown and the run aborts.
# loudness_check:
#   per_system:
#     threshold: .inf
#     verbose: true
#   per_item:
#     threshold: 1.0 # LU
#     verbose: false

# -- Silence check (optional) -------------------------------------------------
# When configured, each clip's leading and trailing silence is measured and
# the run aborts if a threshold is exceeded. Silence is detected on short-term
# RMS. The thresholds are absolute, so recordings whose noise floor sits
# above floor_db read as sound end to end and the check finds nothing.
# silence_check:
#   floor_db: -50.0 # below this a reading is silence.
#   hysteresis_db: 5.0 # sound begins at floor_db + this, ends at floor_db.
#   debounce_ms: 30.0 # the shortest sound that counts, so a click is ignored.
#   window_ms: 25.0 # how much audio one reading averages.
#   hop_ms: 10.0 # how often a reading is taken.
#   include_reference: true # include the reference system in the check.
#   leading:
#     per_item:
#       threshold: 0.05 # seconds
#       verbose: true
#     per_stimulus:
#       threshold: 0.5
#   trailing:
#     per_item:
#       threshold: 0.1
#       verbose: true
#     per_stimulus:
#       threshold: 0.5

# -- Loudness normalization (optional) ----------------------------------------
# When configured, every stimulus is loudness-normalized to `target` (LUFS)
# before the test, writing WAV copies (into the bundle on export, into a cache
# on serve). Mutually exclusive with loudness_check (normalization is the fix,
# the check is the gate). `scope: stimulus` (default) brings every clip to the
# same loudness. `scope: system` applies one gain per system so the system's
# mean reaches target, preserving the natural loudness differences between
# items within a system.
# loudness_normalization:
#   target: -23.0
#   scope: stimulus

# -- Rating labels (optional, shown below each rating button) -----------------
# Defaults to the ITU-T P.800 7-point CCR scale shown below.
# rating_labels:
#   -3: "Much worse"
#   -2: "Worse"
#   -1: "Slightly worse"
#   0: "About the same"
#   +1: "Slightly better"
#   +2: "Better"
#   +3: "Much better"

# -- Keyboard shortcuts (all fields optional, shown with defaults) ------------
# Each key must be a single character (e.g. "a", "1") or a named key such as
# Space, Enter, Tab, Escape, or Arrow{Left,Right,Up,Down} (case-sensitive).
# shortcuts:
#   play: Space
#   rewind: r
#   rating:
#     -3: 1
#     -2: 2
#     -1: 3
#     0: 4
#     +1: 5
#     +2: 6
#     +3: 7
#   prev: ArrowLeft
#   next: ArrowRight
#   confirm: Enter # next on intermediate pages, submit on last page

# -- Listener metadata form (optional) ----------------------------------------
# When defined, a form is shown before the test starts to collect listener
# information. Omit this section entirely to skip the form.
# metadata:
#   title: "Listener Information" # optional page heading
#   description: | # optional prose under the heading
#     Data collected in this test is used for research purposes only.
#
#     It is never shared with third parties, and nothing identifies you
#     beyond what you enter below.
#   fields:
#     - key: listener
#       label: "User name"
#       type: text
#       required: true
#     - key: device
#       label: "Playback device"
#       type: select
#       options:
#         - Headphones
#         - Earphones
#         - Speakers
#       default: Headphones

# -- Post-test survey (optional) ----------------------------------------------
# When defined, a questionnaire is shown after the last trial to collect
# listener feedback. Omit this section entirely to skip the form.
# survey:
#   title: "Questionnaire"
#   fields:
#     - key: trial_count
#       label: "Was the number of trials appropriate?"
#       type: select
#       options:
#         - "Too Few"
#         - "Appropriate"
#         - "Too Many"
#       required: true

# -- Per-answer metrics (optional) --------------------------------------------
# Measurements of how each answer was produced, rather than of the systems
# under test. Each is opt-in. Omit this section to record nothing.
#   response_time - seconds from the listener first playing audio on a page to
#                   moving on from it, minus the clip time they had to sit
#                   through to get there. A quality-control aid (spotting
#                   rushed or fatigued listeners), not a measure of the test.
# metrics:
#   response_time: false
