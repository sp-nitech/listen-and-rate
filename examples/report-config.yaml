# Listen and Rate - Example report (figure) configuration.

# Figure scale: multipliers (not pixels) on the report's base dimensions.
scale:
  width: 1.0
  height: 1.0

# Font settings for figure text.
font:
  family: sans-serif # Must be a font installed on your system
  size: 13

# Confidence level for the error bars. The significance tables use
# alpha = 1 - confidence (0.95 -> 0.05, 0.99 -> 0.01).
confidence: 0.95

# Display order of systems/pairs, by their raw name as stored in the results.
# When given, it must list EVERY system present in the results. Omit to fall
# back to the experiment config's order.
# order: [A, B]

# Display labels for systems (charts/tables only); the stored data keeps its
# raw names. Unlisted systems keep their raw name.
# labels:
#   A: Proposed
#   B: Baseline

# Stacked report sections (optional). Each group renders its own full set of
# figures and tables under an <h2> heading, one section after another. A group
# without filters covers every session; metadata_filter keys name listener
# metadata fields (a non-matching session drops entirely), stimuli_filter keys
# name stimulus-side columns (utterance = the results' utterance column, i.e.
# the file stem in stimuli_dirs mode; or system) and drop individual trials.
# Values are glob patterns (* and ?; a plain value is an exact match), a list
# of patterns is OR, and multiple keys/filters combine with AND. Omit groups
# entirely for the usual single-section report.
# groups:
#   - label: All listeners
#   - label: Headphones only
#     metadata_filter:
#       device: Headphones
#   - label: Speaker m001
#     stimuli_filter:
#       utterance: "*_m001_*"
