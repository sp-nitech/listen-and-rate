# Listen and Rate - Example report (figure) configuration.

# Rendering multipliers (not pixels). `width`/`height` scale the figures'
# canvas; `bar_width` scales the bars' thickness within their slot (1.0 is
# Plotly's default look; boxplots unaffected); `png` scales the resolution
# of the toolbar's PNG download (on-screen display unaffected).
scale:
  width: 1.0
  height: 1.0
  bar_width: 1.0
  png: 2.0

# Font used for figure text. `family` accepts any CSS font-family.
# Generic families (`sans-serif`, `serif`, `monospace`) always work.
# For specific fonts such as `Georgia`, include fallbacks for example
# "Helvetica, Arial, sans-serif" because the font must be installed on the
# machine viewing the report.
font:
  family: sans-serif
  size: 13

# Bar fill colours (any CSS colour). `mean_bar` fills the mean/rate bars,
# `count_bar` the raw-count bars.
color:
  mean_bar: "#72b7b2"
  count_bar: "#cd5c5c"

# Confidence level for the error bars. The significance tables use
# alpha = 1 - confidence (0.95 -> 0.05, 0.99 -> 0.01).
confidence: 0.95

# Display order of systems/pairs, by their raw name as stored in the results.
# When given, it must list EVERY system present in the results. Omit to fall
# back to the experiment config's order.
# order: [A, B]

# Display labels for systems (charts/tables only); the stored data keeps its
# raw names. Unlisted systems keep their raw name.
# labels:
#   A: Proposed
#   B: Baseline

# Name of the centered "no preference" bar in the AB count chart (its position
# is always centered between the two systems). Ignored by the other test types.
# tie_label: "No preference"

# Stacked report sections (optional). Each group renders its own full set of
# figures and tables under an <h2> heading, one section after another. Omit
# groups entirely for the usual single-section report.
# groups:
#   - label: All listeners
#   - label: Speaker m001
#     stimuli_filter:
#       utterance: "*_m001_*"
#   - label: Headphones only
#     metadata_filter:
#       device: Headphones
#   - label: Expert only
#     survey_filter:
#       expertise: Expert
